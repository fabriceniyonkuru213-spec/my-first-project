<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e3a8a);
      display:flex;
      flex-direction:column;
      color:white;
    }

    /* NAVBAR */

    nav{
      width:100%;
      padding:18px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      font-size:24px;
      font-weight:bold;
      letter-spacing:1px;
    }

    .nav-links{
      display:flex;
      gap:25px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:15px;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#60a5fa;
    }

    /* MAIN SECTION */

    .container{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
    }

    .login-box p{
      text-align:center;
      margin-bottom:30px;
      color:#cbd5e1;
      font-size:14px;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      outline:none;
      background:rgba(255,255,255,0.12);
      color:white;
      font-size:15px;
    }

    .input-group input::placeholder{
      color:#cbd5e1;
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      font-size:14px;
    }

    .options a{
      color:#93c5fd;
      text-decoration:none;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .login-btn:hover{
      background:#1d4ed8;
      transform:translateY(-2px);
    }

    .signup{
      text-align:center;
      margin-top:20px;
      font-size:14px;
      color:#cbd5e1;
    }

    .signup a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:bold;
    }

    .message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      color:#86efac;
    }

    /* MOBILE */

    @media(max-width:768px){

      nav{
        flex-direction:column;
        gap:15px;
      }

      .nav-links{
        flex-wrap:wrap;
        justify-content:center;
      }

      .login-box{
        padding:30px 25px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="logo">SchoolCMS</div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Admissions</a>
      <a href="#">Academics</a>
      <a href="#">Events</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- LOGIN FORM -->

  <div class="container">

    <div class="login-box">

      <h2>Welcome Back</h2>
      <p>Login to continue to your dashboard</p>

      <form id="loginForm">

        <div class="input-group">
          <label>Email Address</label>
          <input 
            type="email" 
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label>Password</label>
          <input 
            type="password" 
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="options">
          <label>
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

        <div class="message" id="message"></div>

      </form>

      <div class="signup">
        Don't have an account?
        <a href="#">Create Account</a>
      </div>

    </div>

  </div>

  <!-- JAVASCRIPT -->

  <script>

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", function(e){

      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if(email === "" || password === ""){
        message.style.color = "#fca5a5";
        message.innerText = "Please fill in all fields";
        return;
      }

      // Example validation

      if(password.length < 6){
        message.style.color = "#fca5a5";
        message.innerText = "Password must be at least 6 characters";
        return;
      }

      // Success message

      message.style.color = "#86efac";
      message.innerText = "Login successful!";

      console.log("Email:", email);
      console.log("Password:", password);

    });

  </script>

</body>
</html>
